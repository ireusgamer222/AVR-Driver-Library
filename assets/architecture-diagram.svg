<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Where This Library Fits</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#666666">Every call flows downward. Nothing below ever calls back up.</text>

  <!-- ===================== APPLICATION LAYER (dashed, not included) ===================== -->
  <rect x="90" y="80" width="720" height="70" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="450" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#555555">Your Application</text>
  <text x="450" y="132" text-anchor="middle" font-size="12.5" fill="#777777">State machines, menus, business logic — NOT included in this repo</text>

  <line x1="450" y1="150" x2="450" y2="176" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== HAL LAYER ===================== -->
  <rect x="60" y="180" width="780" height="150" rx="10" fill="#FCEBEC" stroke="#B7282E" stroke-width="2"/>
  <text x="90" y="206" font-size="16" font-weight="700" fill="#B7282E">HAL — Hardware Abstraction Layer</text>
  <text x="90" y="225" font-size="12" fill="#8a3033">Drivers for actual external components. Talks to MCAL, never to registers directly.</text>

  <!-- HAL chips -->
  <g font-size="12.5" fill="#5c1417">
    <rect x="90"  y="242" width="108" height="34" rx="6" fill="#ffffff" stroke="#B7282E"/>
    <text x="144" y="263" text-anchor="middle">LCD</text>

    <rect x="210" y="242" width="108" height="34" rx="6" fill="#ffffff" stroke="#B7282E"/>
    <text x="264" y="263" text-anchor="middle">EEPROM</text>

    <rect x="330" y="242" width="118" height="34" rx="6" fill="#ffffff" stroke="#B7282E"/>
    <text x="389" y="263" text-anchor="middle">SERVO MOTOR</text>

    <rect x="460" y="242" width="108" height="34" rx="6" fill="#ffffff" stroke="#B7282E"/>
    <text x="514" y="263" text-anchor="middle">KEYPAD</text>

    <rect x="580" y="242" width="130" height="34" rx="6" fill="#ffffff" stroke="#B7282E"/>
    <text x="645" y="263" text-anchor="middle">STEPPER MOTOR</text>

    <rect x="722" y="242" width="118" height="34" rx="6" fill="#ffffff" stroke="#B7282E"/>
    <text x="781" y="263" text-anchor="middle" font-size="11.5">7-SEGMENT</text>
  </g>
  <text x="90" y="308" font-size="11.5" fill="#8a3033" font-style="italic">Example: LCD_voidSendString() → built from DIO_setPinValue() calls underneath</text>

  <line x1="450" y1="330" x2="450" y2="356" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== MCAL LAYER ===================== -->
  <rect x="60" y="360" width="780" height="150" rx="10" fill="#EAF1FB" stroke="#2B5FA8" stroke-width="2"/>
  <text x="90" y="386" font-size="16" font-weight="700" fill="#2B5FA8">MCAL — Microcontroller Abstraction Layer</text>
  <text x="90" y="405" font-size="12" fill="#294a73">Talks directly to ATmega32 registers. The lowest software layer in this repo.</text>

  <g font-size="12.5" fill="#16304f">
    <rect x="90"  y="422" width="90"  height="34" rx="6" fill="#ffffff" stroke="#2B5FA8"/>
    <text x="135" y="443" text-anchor="middle">DIO</text>

    <rect x="192" y="422" width="100" height="34" rx="6" fill="#ffffff" stroke="#2B5FA8"/>
    <text x="242" y="443" text-anchor="middle">TIMERS</text>

    <rect x="304" y="422" width="100" height="34" rx="6" fill="#ffffff" stroke="#2B5FA8"/>
    <text x="354" y="443" text-anchor="middle">USART</text>

    <rect x="416" y="422" width="80"  height="34" rx="6" fill="#ffffff" stroke="#2B5FA8"/>
    <text x="456" y="443" text-anchor="middle">TWI</text>

    <rect x="508" y="422" width="80"  height="34" rx="6" fill="#ffffff" stroke="#2B5FA8"/>
    <text x="548" y="443" text-anchor="middle">SPI</text>

    <rect x="600" y="422" width="80"  height="34" rx="6" fill="#ffffff" stroke="#2B5FA8"/>
    <text x="640" y="443" text-anchor="middle">ADC</text>

    <rect x="692" y="422" width="148" height="34" rx="6" fill="#ffffff" stroke="#2B5FA8"/>
    <text x="766" y="443" text-anchor="middle" font-size="11.5">EXTI / WDT / GLBI</text>
  </g>
  <text x="90" y="488" font-size="11.5" fill="#294a73" font-style="italic">Example: TWI_MasterWriteDataByte() → reads/writes TWCR, TWDR, TWSR directly</text>

  <line x1="450" y1="510" x2="450" y2="536" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== HARDWARE ===================== -->
  <rect x="200" y="540" width="500" height="60" rx="10" fill="#2d2d2d"/>
  <text x="450" y="565" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ATmega32 Hardware Registers</text>
  <text x="450" y="584" text-anchor="middle" font-size="11.5" fill="#cccccc">TWCR · UDR · TCCR1A · ADMUX · DDRx · PORTx · ...</text>

  <!-- Side note -->
  <text x="450" y="628" text-anchor="middle" font-size="12" fill="#666666">Change the hardware → edit one driver's *_CONFIG.h. The layers above never need to know.</text>
</svg>
